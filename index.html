<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dental Clinic Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; }
    #chat-container { max-width:600px; margin:40px auto; background:#fff;
                      border:1px solid #ccc; border-radius:6px; padding:16px; }
    #messages { height:400px; overflow-y:auto; border:1px solid #eee;
                padding:8px; margin-bottom:12px; }
    .msg { margin:6px 0; }
    .user { text-align:right; color:#0057b7; }
    .bot { text-align:left; color:#333; }
    #input-row { display:flex; gap:8px; }
    #user-input { flex:1; padding:8px; }
    #send-btn { padding:8px 16px; }
  </style>
</head>
<body>
  <div id="chat-container">
    <h2>Dental Clinic Chatbot</h2>
    <div id="messages"></div>
    <div id="input-row">
      <input id="user-input" type="text" placeholder="Ask about timings, fees, services..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
